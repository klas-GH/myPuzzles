<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#090b16">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">

  <title>Lights Out</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
<a href="../index.html" class="home-btn" aria-label="Home">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 10.5 12 3l9 7.5"></path>
    <path d="M5.5 9.5V21h13V9.5"></path>
  </svg>
  <span>Home</span>
</a>

  <div class="game">

    <h1>Lights Out</h1>
    <div style="color:#ffaaff; margin: 5px;">Turn off all the lights</div>

<div class="difficulty">

  <button
    class="difficulty-button active"
    data-size="3">
    Easy
  </button>

  <button
    class="difficulty-button"
    data-size="4">
    Normal
  </button>

  <button
    class="difficulty-button"
    data-size="5">
    Difficult
  </button>

</div>

<div id="themes" class="themes">

  <button
    class="theme-button active"
    data-theme="classic">
    Classic
  </button>

  <button
    class="theme-button locked"
    data-theme="forest"
    disabled>
    🔒 Forest
  </button>

  <button
    class="theme-button locked"
    data-theme="sunset"
    disabled>
    🔒 Sunset
  </button>

  <button
    class="theme-button locked"
    data-theme="ocean"
    disabled>
    🔒 Ocean
  </button>

</div>

    <div class="stats">

  <div>
    Best: <span id="bestCount">0</span>
  </div>

  <div>
    Moves: <span id="moveCount">0</span>
  </div>

</div>


    <div id="board" class="board"></div>

    <div id="winMessage" class="win-message">

      <div class="win-title">
        🎉 Solved!
      </div>

      <div class="win-moves">
        Moves
        <strong id="winMoves">0</strong>
      </div>

      <button id="newPuzzle" class="new-puzzle">
        New Puzzle
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
