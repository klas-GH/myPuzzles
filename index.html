<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b16">
  <title>Mini Puzzle Games</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="launcher">

    <header class="hero">
      <div class="logo-mark">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <p class="eyebrow">WELCOME TO</p>
      <h1>Mini Puzzle Games</h1>
      <p class="subtitle">Pick a game and start playing.</p>
    </header>

    <section class="games" aria-label="Mini puzzle games">

      <a class="game-card purple" href="puzzle1/index.html">
        <div class="icon">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <rect x="10" y="15" width="44" height="34" rx="7"/>
            <path d="M20 32h12M26 26v12"/>
            <circle cx="43" cy="28" r="3"/>
            <circle cx="48" cy="36" r="3"/>
          </svg>
        </div>
        <div class="game-info">
          <span class="game-number">01</span>
          <h2>15 Puzzle</h2>
          <span class="play">PLAY <b>→</b></span>
        </div>
      </a>

      <a class="game-card blue" href="puzzle2/index.html">
        <div class="icon">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="21"/>
            <path d="M32 19v14l10 6"/>
            <path d="M21 10l-5 5M43 10l5 5"/>
          </svg>
        </div>
        <div class="game-info">
          <span class="game-number">02</span>
          <h2>Lights Out</h2>
          <span class="play">PLAY <b>→</b></span>
        </div>
      </a>

      <a class="game-card green" href="puzzle3/index.html">
        <div class="icon">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 9l7 15 16 2-12 11 4 16-15-8-15 8 4-16-12-11 16-2z"/>
          </svg>
        </div>
        <div class="game-info">
          <span class="game-number">03</span>
          <h2>Color Connect</h2>
          <span class="play">PLAY <b>→</b></span>
        </div>
      </a>

      <a class="game-card orange" href="puzzle4/index.html">
        <div class="icon">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 8l5.5 17L55 31l-17.5 6L32 54l-5.5-17L9 31l17.5-6z"/>
            <circle cx="48" cy="16" r="5"/>
          </svg>
        </div>
        <div class="game-info">
          <span class="game-number">04</span>
          <h2>Color Sort</h2>
          <span class="play">PLAY <b>→</b></span>
        </div>
      </a>

      <a class="game-card pink" href="puzzle5/index.html">
        <div class="icon">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 54S10 41 10 25c0-8 5-13 12-13 5 0 8 3 10 7 2-4 5-7 10-7 7 0 12 5 12 13 0 16-22 29-22 29z"/>
          </svg>
        </div>
        <div class="game-info">
          <span class="game-number">05</span>
          <h2>Pattern Memory</h2>
          <span class="play">PLAY <b>→</b></span>
        </div>
      </a>

      <a class="game-card cyan" href="puzzle6/index.html">
        <div class="icon">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 8l7 16 17 2-13 12 4 17-15-9-15 9 4-17L8 26l17-2z"/>
            <path d="M32 17v22M21 28h22"/>
          </svg>
        </div>
        <div class="game-info">
          <span class="game-number">06</span>
          <h2>Box Push</h2>
          <span class="play">PLAY <b>→</b></span>
        </div>
      </a>

    </section>

    <footer>
      <span>6 MINI GAMES</span>
      <span>•</span>
      <span>CHOOSE YOUR CHALLENGE</span>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
